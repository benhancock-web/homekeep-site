<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121917" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="Otterly">
{{robots}}
{{app_meta}}
<link rel="icon" href="{{base}}/assets/brand/otterly-mark-small.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}/assets/img/apple-touch-icon.png">
<link rel="preload" href="{{base}}/assets/fonts/Newsreader_600SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}/assets/fonts/AlbertSans_400Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}/assets/css/fonts.css">
<link rel="stylesheet" href="{{base}}/assets/css/tokens.css">
<link rel="stylesheet" href="{{base}}/assets/css/site.css">
{{structured}}
</head>
<body class="{{body_class}}">
{{icons}}
<a class="skip" href="#main">Skip to content</a>
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
{{menu}}
{{app_banner}}
<script>
(function () {
  var btn = document.getElementById('menuBtn'), sheet = document.getElementById('menuSheet'), close = document.getElementById('menuClose');
  function focusables() { return sheet.querySelectorAll('a, button'); }
  function openMenu() { sheet.hidden = false; document.body.classList.add('menu-open'); btn.setAttribute('aria-expanded', 'true'); close.focus(); }
  function closeMenu() { sheet.hidden = true; document.body.classList.remove('menu-open'); btn.setAttribute('aria-expanded', 'false'); btn.focus(); }
  if (btn && sheet) {
    btn.addEventListener('click', openMenu);
    close.addEventListener('click', closeMenu);
    sheet.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeMenu(); return; }
      if (e.key !== 'Tab') return;
      var f = focusables(), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    sheet.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { sheet.hidden = true; document.body.classList.remove('menu-open'); }); });
  }
  // App-first: on a phone, point iPhone and Android visitors at their store. "Continue on the website" hides it for 30 days.
  var ab = document.getElementById('appBanner');
  if (ab) {
    var cfg = JSON.parse(ab.getAttribute('data-apps')), ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPod/.test(ua) || (/iPad/.test(ua)), isAndroid = /Android/.test(ua);
    var isSafari = isIOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
    var url = isIOS ? cfg.ios : isAndroid ? cfg.android : '';
    var until = 0; try { until = +localStorage.getItem('otterly-app-banner') || 0; } catch (e) {}
    if (url && Date.now() > until && !(isSafari && cfg.smart)) {
      document.getElementById('appBannerGet').href = url;
      ab.hidden = false; document.body.classList.add('has-app-banner');
      document.getElementById('appBannerStay').addEventListener('click', function () {
        ab.hidden = true; document.body.classList.remove('has-app-banner');
        try { localStorage.setItem('otterly-app-banner', String(Date.now() + 30 * 864e5)); } catch (e) {}
      });
    }
  }
  // Screen galleries: the arrow buttons scroll by one screen; the row itself also scrolls by touch, trackpad and keyboard.
  document.querySelectorAll('[data-gallery]').forEach(function (g) {
    var row = g.querySelector('.gallery-row'), prev = g.querySelector('[data-prev]'), next = g.querySelector('[data-next]');
    function step() { var it = row.querySelector('figure'); return it ? it.getBoundingClientRect().width + 20 : 300; }
    function sync() { if (!prev) return; prev.disabled = row.scrollLeft < 8; next.disabled = row.scrollLeft + row.clientWidth > row.scrollWidth - 8; }
    if (prev) { prev.addEventListener('click', function () { row.scrollBy({ left: -step(), behavior: 'smooth' }); });
                next.addEventListener('click', function () { row.scrollBy({ left: step(), behavior: 'smooth' }); }); }
    row.addEventListener('scroll', sync, { passive: true }); window.addEventListener('resize', sync); sync();
  });
})();
</script>
</body>
</html>
